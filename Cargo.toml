[package]
name = "docs-app"
version = "0.1.0"
edition = "2021"

[dependencies]
# No default features: Rocket's `http2` feature pulls in the vulnerable h2 0.3.x
# The backend has no TLS and serves HTTP/1.1 only.
rocket = { version = "0.5.1", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4"] }
rocket_cors = "0.6.0"
# Azure Blob storage (SharedKey) via Apache object_store; see src/storage.rs
object_store = { version = "0.14.2", default-features = false, features = ["azure"] }
# Builds the signed container-bootstrap request for object_store's AzureAuthorizer
http = "1"
futures = "0.3.31"
# HTTPS requests for storage and MCP authorization server metadata
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs"] }
base64 = "0.22"

[dev-dependencies]
aws-lc-rs = "1"
